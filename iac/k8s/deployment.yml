apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: python-server
  template:
    metadata:
      labels:
        app: python-server
    spec:
      containers:
        - name: python-server
          image: sawyre/fastapi-server:latest
          imagePullPolicy: Always
          ports:
            - name: server-port
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: server-port
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 6